<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="css/style.css" rel="stylesheet" type="text/css">
  <title>Форма заявки на работу в зоопарке</title>
</head>

<body>
  <section class="border_of_form">
    <h1 class="title">Форма заявки на работу в зоопарке</h1>
    <p class="subtitle">Пожалуйста, заполните форму. Обязательные поля помечены *</p>
    <form class="form">
      <fieldset>
        <legend>Контактная информация</legend>
        <div class="first_block">

          <div class="form_row">
            <label for="user-name">
              <span class="form_input_name">Имя<span class="required_field">*</span></span>
              <input type="text" class="form_input" name="user-name">
            </label>
          </div>

          <div class="form_row">
            <label for="user-phone">
              <span class="form_input_name">Телефон</span>
              <input type="tel" class="form_input" name="user-phone">
            </label>
          </div>

          <div class="form_row">
            <label for="user-mail">
              <span class="form_input_name">Email<span class="required_field">*</span></span>
              <input type="email" class="form_input" name="user-mail">
            </label>
          </div>

        </div>
      </fieldset>
    </form>
    <form class="form">
      <fieldset>
        <legend>Персональная информация</legend>
        <div class="first_block">

          <div class="form_row">
            <label for="user-name">
              <span class="form_input_name">Возраст<span class="required_field">*</span></span>
              <input type="number" class="form_input" name="user-age">
            </label>
          </div>

          <div class="form_row">
            <label for="user-gender">
              <span class="form_input_name">Пол</span>
              <select id="gender" name="gender">
                <option value="male">Мужчина</option>
                <option value="female">Женщина</option>
              </select>
            </label>
          </div>

          <div class="form_row">
            <label for="user-personal-qualities">
              <span class="form_input_name">Перечислите<br> личные<br> качества</span>
              <input type="text" class="form_input" name="user-personal-qualities">
            </label>
          </div>
        </div>
      </fieldset>
    </form>
    <form class="form">
      <fieldset>
        <legend>Выберите ваших любимых животных</legend>
        <div class="third_block">
          <label>
            <input type="checkbox" name="animals" value="zebra" class="animals">
            Зебра
          </label>
          <label>
            <input type="checkbox" name="animals" value="cat" class="animals">
            Кошка
          </label>
          <label>
            <input type="checkbox" name="animals" value="anaconda" class="animals">
            Анаконда
          </label>
          <label>
            <input type="checkbox" name="animals" value="human" class="animals">
            Человек
          </label>
          <label>
            <input type="checkbox" name="animals" value="elephant" class="animals">
            Слон
          </label>
          <label>
            <input type="checkbox" name="animals" value="antelope" class="animals">
            Антилопа
          </label>
          <label>
            <input type="checkbox" name="animals" value="pigeon" class="animals">
            Голубь
          </label>
          <label>
            <input type="checkbox" name="animals" value="crab" class="animals">
            Краб
          </label>
        </div>
      </fieldset>
    </form>
    <button class="button">Отправить информацию</button>
  </section>
</body>

</html>
