<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="css/style.css" rel="stylesheet" type="text/css">
  <title>Document</title>
</head>

<body>
  <div class="border_of_form">
    <h1 class="title">Форма заявки на работу в зоопарке</h1>
    <p class="subtitle">Пожалуйста, заполните форму. Обязательные поля помечены *</p>
    <form class="form">
      <fieldset>
        <legend class="legend">Контактная информация</legend>
        <div class="first_block">

          <div class="form_row">
            <label for="user-name" class="form_label">
              <span class="form_input_name">Имя*</span>
              <input type="text" class="form_input" name="user-name">
            </label>
          </div>

          <div class="form_row">
            <label for="user-phone" class="form_label">
              <span class="form_input_name">Телефон</span>
              <input type="tel" class="form_input" name="user-phone">
            </label>
          </div>

          <div class="form_row">
            <label for="user-mail" class="form_label">
              <span class="form_input_name">Email*</span>
              <input type="email" class="form_input" name="user-mail">
            </label>
          </div>

        </div>
      </fieldset>
    </form>
    <form class="form">
      <fieldset>
        <legend class="legend">Персональная информация</legend>
        <div class="first_block">

          <div class="form_row">
            <label for="user-name">
              <span class="form_input_name">Возраст*</span>
              <input type="number" class="form_input" name="user-age">
            </label>
          </div>

          <div class="form_row">
            <label for="user-gender">
              <span class="form_input_name">Пол</span>
              <select id="gender" name="gender">
                <option value="male">Мужчина</option>
                <option value="female">Женщина</option>
              </select>
            </label>
          </div>

          <div class="form_row">
            <label for="user-personal-qualities">
              <span class="form_input_name">Перечислите<br> личные<br> качества</span>
              <input type="text" class="form_input" name="user-personal-qualities">
            </label>
          </div>
        </div>
      </fieldset>
    </form>
    <form class="form">
      <fieldset>
        <legend class="legend">Выберите ваших любимых животных</legend>
        <div class="third_block">
          <label>
            <input type="checkbox" name="animals" value="zebra">
            Зебра
          </label>
          <label>
            <input type="checkbox" name="animals" value="cat">
            Кошка
          </label>
          <label>
            <input type="checkbox" name="animals" value="anaconda">
            Анаконда
          </label>
          <label>
            <input type="checkbox" name="animals" value="human">
            Человек
          </label>
          <label>
            <input type="checkbox" name="animals" value="elephant">
            Слон
          </label>
          <label>
            <input type="checkbox" name="animals" value="antelope">
            Антилопа
          </label>
          <label>
            <input type="checkbox" name="animals" value="pigeon">
            Голубь
          </label>
          <label>
            <input type="checkbox" name="animals" value="crab">
            Краб
          </label>
        </div>
      </fieldset>
    </form>
    <button class="button">Отправить информацию</button>
  </div>
</body>

</html>
